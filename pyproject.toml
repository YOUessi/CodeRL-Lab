[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coderl-lab"
version = "0.1.0"
description = "面向代码任务的可验证奖励大语言模型后训练与能力边界实验平台"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
data = [
  "datasets==5.1.0",
]
model = [
  "torch==2.10.0",
  "transformers==5.18.0",
  "accelerate==1.15.0",
  "datasets==5.1.0",
  "trl==1.14.1",
  "peft==0.21.2",
  "Pillow==12.3.0",
  "requests==2.34.2",
]
benchmark = [
  "evalplus==0.3.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
