[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coderl-lab"
version = "0.1.0"
description = "面向代码任务的可验证奖励大语言模型后训练与能力边界实验平台"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
model = [
  "torch",
  "transformers",
  "accelerate",
  "datasets",
  "trl",
  "peft",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
