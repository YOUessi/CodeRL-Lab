name: EXP-004N frozen v5 public-only dataset

on:
  push:
    branches:
      - exp/livecodebench-verifier-gated
    paths:
      - .github/workflows/exp004n-v5-public-data.yml
  workflow_dispatch:

jobs:
  public-only-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU data tooling
        run: python -m pip install -e ".[data,dev]"
      - name: Verify v5/v6 parser behavior
        run: pytest -q tests/test_livecodebench_adapter.py
      - name: Build pinned v5-only public benchmark
        run: |
          python -m coderl_lab.datasets.livecodebench \
            --fine-grained-version v5 \
            --output-dir artifacts/exp004n/data
      - name: Verify no private tests exported, exact pinned source
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          m = json.loads(Path("artifacts/exp004n/data/manifest.json").read_text())
          pub = Path("artifacts/exp004n/data/public_tasks.jsonl")
          assert m["fine_grained_version"] == "v5"
          assert m["source_filename"] == "test5.jsonl"
          assert m["source_revision"] == "0fe84c3912ea0c4d4a78037083943e8f0c4dd505"
          assert m["private_tests_exported"] is False
          assert m["private_tests_decoded"] is False
          assert m["tasks"] > 0
          assert hashlib.sha256(pub.read_bytes()).hexdigest() == m["public_view_sha256"]
          rows = [json.loads(x) for x in pub.read_text().splitlines() if x.strip()]
          assert len(rows) == m["tasks"]
          assert len(set(x["question_id"] for x in rows)) == len(rows)
          assert all("private_test_cases" not in row for row in rows)
          print("EXP-004N public-only metadata verified; tasks:",len(rows))
          print("Frozen public SHA256:",m["public_view_sha256"])
          print("Dataset v5 source SHA256:",m["source_sha256"])
          PY
      - name: Archive public-only data + manifest (never raw private file)
        uses: actions/upload-artifact@v4
        with:
          name: exp004n-pinned-v5-public
          path: |
            artifacts/exp004n/data/public_tasks.jsonl
            artifacts/exp004n/data/manifest.json
          retention-days: 30
          if-no-files-found: error
