name: TRAIN-008A frozen reward preference audit

on:
  push:
    branches:
      - feat/posttraining-reward-model
    paths:
      - .github/workflows/train008a-reward-data-audit.yml
      - src/coderl_lab/train/reward_model.py
      - configs/posttrain_a_reward_model_qwen3_1.7b.yaml
  workflow_dispatch:

jobs:
  public-frozen-preference-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Retrieve exact prior frozen HF snapshot from GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/generated/posttrain-h4-v1
          gh run download 37725387735 \
            --repo YOUessi/CodeRL-Lab \
            --name posttraining-frozen-h4-v1 \
            --dir data/generated/posttrain-h4-v1
      - name: Audit real 2048/256 selected preference pairs without CUDA
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from coderl_lab.train.reward_model import validate_preference_snapshot,render_pair
          root=Path("data/generated/posttrain-h4-v1")
          cfg, train, eval_, frozen=validate_preference_snapshot(
              config_path=Path("configs/posttrain_a_reward_model_qwen3_1.7b.yaml"),
              train_path=root/"dpo_train.jsonl",
              heldout_path=root/"dpo_validation.jsonl",
              manifest_path=root/"dpo_manifest.json",
          )
          assert frozen["formal"] and len(train)==2048 and len(eval_)==256
          assert all(a!=b and a.startswith(row["prompt"]) and b.startswith(row["prompt"])
                     for row in train for a,b in [render_pair(row)])
          clean={
              "experiment":"TRAIN-008A","stage":"real_data_audit_no_model_training",
              "source":"prior_frozen_GitHub_Action_37725387735",
              "train_pairs":len(train),"heldout_pairs":len(eval_),
              "training_identity":frozen,
              "prompt_overlap":0,
              "private_or_hidden_data_used":False,
              "gpu_training_completed":False,
          }
          out=Path("artifacts/train008a")
          out.mkdir(parents=True,exist_ok=True)
          (out/"real_data_audit.json").write_text(json.dumps(clean,indent=2)+"\n")
          print(json.dumps({k:v for k,v in clean.items() if k!="training_identity"},indent=2))
          PY
      - name: Upload audit summary, not private data or raw preference text
        uses: actions/upload-artifact@v4
        with:
          name: train008a-real-frozen-preference-audit
          path: artifacts/train008a/real_data_audit.json
          retention-days: 30
