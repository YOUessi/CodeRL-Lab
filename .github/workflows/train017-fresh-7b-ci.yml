name: TRAIN-017 7B Fresh Algorithm Contract
on:
  push:
    branches: [exp/train017-7b-algorithm-study]
  pull_request:
    branches: [feat/train016-7b-grpo-qlora]
  workflow_dispatch:
jobs:
  frozen-new-code-algorithms:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: python -m pip install --disable-pip-version-check pytest PyYAML
      - name: Check 72 task oracles and model identity, 576 response matrix and task-clustered CI
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_train017_new_oracles.py tests/test_train017_three_arm_heldout.py
