name: EXP-004P public-only dataset tests
on:
  push:
    branches:
      - exp/exp004p-prospective-capability-transfer
    paths:
      - 'src/coderl_lab/datasets/exp004p_public_v4.py'
      - 'tests/test_exp004p_public_v4.py'
      - '.github/workflows/exp004p-public-data-tests.yml'
  workflow_dispatch:

jobs:
  public-only-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Verify public-only selection and private data isolation
        run: python -m pytest -q tests/test_exp004p_public_v4.py
