name: TRAIN-007C frozen DPO token filter audit

on:
  push:
    branches:
      - feat/posttraining-track-a-data-qlora
    paths:
      - .github/workflows/train007c-dpo-token-audit.yml
      - src/coderl_lab/analysis/posttrain_dpo_token_audit.py
      - tests/test_posttrain_dpo_token_audit.py
  workflow_dispatch:

jobs:
  frozen-effective-samples:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU tokenizer and test dependencies
        run: python -m pip install -e ".[dev]" "transformers==5.18.0"
      - name: Download exactly frozen UltraFeedback 2048/256 preference rows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/generated/posttrain-h4-v1
          gh run download 37725387735 \
            --repo YOUessi/CodeRL-Lab \
            --name posttraining-frozen-h4-v1 \
            --dir data/generated/posttrain-h4-v1
      - name: Run offline unit regression
        run: pytest -q tests/test_posttrain_dpo_token_audit.py
      - name: Real Qwen3 tokenizer DPO filtering audit
        run: python -m coderl_lab.analysis.posttrain_dpo_token_audit
      - name: Verify count prediction before metric claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("artifacts/train007c/preprocessing_audit.json").read_text())
          assert x["train"]["raw_pairs"]==2048
          assert x["heldout"]["raw_pairs"]==256
          assert x["new_cuda_training"] is False
          assert x["expected_optimizer_steps_one_epoch"] > 0
          assert x["train"]["kept_pairs_after_keep_start_prompt_filter"] <= 2048
          print("TRAIN-007C effective training input count:",x["train"]["kept_pairs_after_keep_start_prompt_filter"])
          print("Predicted DPO optimizer steps:",x["expected_optimizer_steps_one_epoch"])
          PY
      - name: Archive derived lengths/counts only (no raw preference content)
        uses: actions/upload-artifact@v4
        with:
          name: train007c-frozen-tokenizer-audit
          path: artifacts/train007c/preprocessing_audit.json
          if-no-files-found: error
          retention-days: 30
