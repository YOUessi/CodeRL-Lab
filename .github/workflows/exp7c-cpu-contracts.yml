name: EXP-7C CPU contract checks
on:
  push:
    branches:
      - exp/exp7c-humanevalplus-matched-sft
  pull_request:
    branches:
      - exp/7b-capacity-baseline
  workflow_dispatch:
jobs:
  pure-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lean CPU-only requirements
        run: python -m pip install --disable-pip-version-check pytest
      - name: Test deterministic public-only dataset, prompt and code normalization
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_exp7c_public_and_sampling.py tests/test_exp7c_paired_summary.py
