name: EXP-014 Independent HH CPU Contracts
on:
  push:
    branches: [exp/exp014-hh-heldout-blind]
  pull_request:
    branches: [exp/train013-dpo-adapter-precision]
  workflow_dispatch:
jobs:
  hh-data-leakage-blindness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Data freeze and blind review quality gates
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_exp014_hh_data.py tests/test_exp014_blind.py tests/test_exp014_preference.py
