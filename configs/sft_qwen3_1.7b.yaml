experiment:
  id: EXP-006A
  name: qwen3-1.7b-mbpp-lora-sft-replication

model:
  name_or_path: Qwen/Qwen3-1.7B-Base
  revision: ea980cb0a6c2ae4b936e82123acc929f1cec04c1
  dtype: bfloat16

data:
  manifest: data/manifests/mbpp-v1.json
  train_sft: data/generated/mbpp-v1/train_sft.jsonl

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  output_dir: artifacts/exp006a/sft-qwen3-1.7b-lora
  seed: 42
  num_train_epochs: 3
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 0.0002
  warmup_ratio: 0.05
  weight_decay: 0.0
  lr_scheduler_type: cosine
  max_length: 1024
  packing: false
  gradient_checkpointing: true
  logging_steps: 1
  save_strategy: epoch

evaluation:
  validation_tasks: data/generated/mbpp-v1/validation_tasks.jsonl
  samples_per_task: 4
  max_new_tokens: 512
  temperature: 0.8
  top_p: 0.95
  pass_at_k: [1, 4]
