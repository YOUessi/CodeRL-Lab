experiment:
  id: EXP-002
  name: qwen3-0.6b-mbpp-lora-sft

model:
  name_or_path: Qwen/Qwen3-0.6B-Base
  revision: da87bfb608c14b7cf20ba1ce41287e8de496c0cd
  dtype: bfloat16

data:
  manifest: data/manifests/mbpp-v1.json
  train_sft: data/generated/mbpp-v1/train_sft.jsonl

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  output_dir: artifacts/exp002/sft-qwen3-0.6b-lora
  seed: 42
  num_train_epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  warmup_ratio: 0.05
  weight_decay: 0.0
  lr_scheduler_type: cosine
  max_length: 1024
  packing: false
  gradient_checkpointing: true
  logging_steps: 1
  save_strategy: epoch

evaluation:
  validation_tasks: data/generated/mbpp-v1/validation_tasks.jsonl
  samples_per_task: 4
  max_new_tokens: 512
  temperature: 0.8
  top_p: 0.95
  pass_at_k: [1, 4]
