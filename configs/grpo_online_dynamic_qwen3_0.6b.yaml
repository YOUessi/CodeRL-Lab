experiment:
  id: EXP-005B
  name: qwen3-0.6b-online-adaptive-grpo

model:
  name_or_path: Qwen/Qwen3-0.6B-Base
  revision: da87bfb608c14b7cf20ba1ce41287e8de496c0cd
  dtype: bfloat16

initial_policy:
  sft_adapter: artifacts/exp002/sft-qwen3-0.6b-lora
  expected_sha256: 7fcb2b0ca7608be980fb4cbae5158241886ac67f3cc2f5b855cf34531c5982f7

data:
  tasks: data/generated/mbpp-v1/train_tasks.jsonl

online_sampling:
  enabled: true
  version: v1_feedback_sampler
  exploit_fraction: 0.5
  spread_epsilon: 1.0e-12
  note: "Each generation batch uses one online-mixed exploit slot and one exploration slot when batch_size=2."

reward:
  type: public_tests_only
  executor: docker
  docker_image: python:3.11-slim
  timeout_seconds: 5.0
  memory_limit: 512m
  max_workers: 4
  hidden_tests_allowed: false

generation:
  num_generations: 4
  max_completion_length: 256
  temperature: 0.8
  top_p: 0.95
  top_k: 0

training:
  output_dir: artifacts/exp005b/grpo-online-qwen3-0.6b
  seed: 42
  num_train_epochs: 1
  max_steps: 187
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 2
  learning_rate: 0.000001
  warmup_ratio: 0.05
  weight_decay: 0.0
  lr_scheduler_type: cosine
  gradient_checkpointing: true
  dataloader_num_workers: 0
  logging_steps: 1
  save_strategy: "no"
  beta: 0.0
  loss_type: grpo
  scale_rewards: group
  mask_truncated_completions: false
  log_completions: false

budget:
  optimizer_steps: 187
  prompt_groups_per_step: 2
  raw_prompt_groups: 374
  num_generations: 4
  raw_rl_completions: 1496
  offline_screening_completions: 0
  comparison:
    - EXP-003
    - EXP-005A-control
    - EXP-005A-boundary

evaluation:
  validation_tasks: data/generated/mbpp-v1/validation_tasks.jsonl
  samples_per_task: 4
  pass_at_k: [1, 4]
