  dtype: bfloat16
  quantization: nf4
  double_quant: true

policy:
  initial_adapter: artifacts/posttrain-a/train007a-qlora-ultrachat
  expected_adapter_sha256: d8846aa5fb5fd6958d30a24611efd9fb99eb91469a60192937646b58557ce12d
  reference: frozen_identical_sft_adapter
  update: policy_lora_plus_scalar_value_head
  dropout_in_ratio_measurement: disabled
  sampled_eos_behavior: terminate_at_eos

reward:
  adapter: artifacts/posttrain-a/train008a-reward-model
  expected_adapter_sha256: 586fb4cb21bb3408507d6e179d1bd858aca35d7c3e46b1dbef84234d3adbd28c
  reward_model_training_run_status: formal
