  max_length: 768
  max_prompt_tokens: 512
  min_response_tokens: 128
  scalar_scale: 1.0
  scalar_clip_abs: 2.0
  empty_generation_reward: -2.0

data:
  root: data/generated/posttrain-h4-v1
  rollout_source: UltraChat train_sft only
  source_revision: b7fe606ecdbf71e8537946a8d9de5ccf0f6da48b
