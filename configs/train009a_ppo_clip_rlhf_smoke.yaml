  gae_lambda: 0.95
  kl_coefficient: 0.02
  advantage_normalization_epsilon: 0.00000001
  value_loss_coefficient: 0.5
  policy_learning_rate: 0.000005
  value_learning_rate: 0.0001
  gradient_clip_norm: 1.0
  trainable_value_head_initialized_to_zero: true

output:
  dir: artifacts/posttrain-a/train009a-ppo-clip-smoke
  checkpoint_every_n_steps: 2
  no_training_on_validation_labels: true
  artifact_policy: only_hashed_prompts_and_aggregates_in_GitHub
